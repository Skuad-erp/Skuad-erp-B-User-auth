name: CI

# main 반영 전후의 빌드와 테스트 검증
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 저장소 코드 조회에 필요한 최소 권한
permissions:
  contents: read

# 같은 PR 또는 브랜치의 이전 CI 실행 취소
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: 빌드 및 테스트
    runs-on: ubuntu-latest

    # JPA와 Flyway 검증용 임시 PostgreSQL
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: skuad_user_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d skuad_user_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # CI 실행 종료 시 폐기되는 테스트 DB 접속 정보
    env:
      DB_URL: jdbc:postgresql://localhost:5432/skuad_user_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: 저장소 코드 확인
        uses: actions/checkout@v6

      - name: Java 17과 Gradle 캐시 설정
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Gradle Wrapper 실행 권한 부여
        run: chmod +x gradlew

      - name: Gradle 빌드 및 테스트
        run: ./gradlew build --no-daemon
